name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build cp${{ matrix.python-version }} for ${{ matrix.platform.target }} on ${{ matrix.platform.os }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
            args: --release
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
            args: --release
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ''
            args: --release
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: ''
            args: --release

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels (Linux)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.8.7
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: ${{ matrix.platform.args }} --interpreter python${{ matrix.python-version }} --out dist

      - name: Build wheels (non-Linux)
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.8.7
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: ${{ matrix.platform.args }} --interpreter python --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist/
          retention-days: 7

  # ── Android wheel build ─────────────────────────────────────────────
  # Cross-compiled with maturin's Android target handling, for Python 3.13
  # only (the interpreter Chaquopy's curated index and Briefcase Android
  # ship). Wheels carry PEP 738 ``android_<api>_<abi>`` tags, which PyPI
  # accepts and desktop pip ignores.
  build-wheels-android:
    name: Build Android wheel for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # arm64 and x86_64 are the two ABIs maturin-action ships an Android
        # cross-prefix for; arm64 covers devices, x86_64 emulators.
        include:
          - target: aarch64-linux-android
            android_abi: arm64-v8a
          - target: x86_64-linux-android
            android_abi: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Stage Chaquopy Android Python cross-prefix
        # Downloaded here rather than by maturin-action: its default prefix is
        # python.org's 3.14 build (not Chaquopy's 3.13), and maturin re-targets
        # PYO3_CROSS_LIB_DIR to prefix/lib/python3.13 while libpython3.13.so
        # sits in prefix/lib, so both PYO3_CROSS_LIB_DIR and RUSTFLAGS -L are
        # pinned explicitly.
        env:
          PY_VER: '3.13.7'
          TARGET_TRIPLET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          PREFIX_DIR="$RUNNER_TEMP/python-android-$TARGET_TRIPLET"
          mkdir -p "$PREFIX_DIR"
          URL="https://repo.maven.apache.org/maven2/com/chaquo/python/python/${PY_VER}/python-${PY_VER}-${TARGET_TRIPLET}.tar.gz"
          echo "Fetching $URL"
          curl -sSfL "$URL" -o "$PREFIX_DIR/python.tar.gz"
          tar -xzf "$PREFIX_DIR/python.tar.gz" -C "$PREFIX_DIR"
          LIB_DIR="$PREFIX_DIR/prefix/lib"
          test -f "$LIB_DIR/libpython3.13.so" || {
            echo "::error::libpython3.13.so not found at $LIB_DIR"
            ls -la "$LIB_DIR" || true
            exit 1
          }
          echo "PYO3_CROSS_LIB_DIR=$LIB_DIR"     >> "$GITHUB_ENV"
          echo "PYO3_CROSS_PYTHON_VERSION=3.13"  >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-L native=$LIB_DIR"    >> "$GITHUB_ENV"

      - name: Build Android wheel via maturin
        uses: PyO3/maturin-action@v1
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # The API level in the wheel tag; without it maturin scrapes the
          # host kernel and emits tags like android_6_12_<kernel>_<arch>.
          # Chaquopy's floor is API 24 (Android 7.0).
          ANDROID_API_VERSION: '24'
        with:
          # >=1.12.4 emits PEP 738 android_<api>_<abi> tags for
          # *-linux-android targets (1.11.0 was yanked, 1.12.0-1.12.3 buggy).
          maturin-version: v1.13.3
          target: ${{ matrix.target }}
          args: --release --interpreter python3.13 --out dist
          manylinux: 'off'

      - name: Verify android_24_<abi> wheel produced
        env:
          ABI: ${{ matrix.android_abi }}
        run: |
          set -euo pipefail
          expected_tag="android_24_${ABI//-/_}"
          ls -lh dist/
          test -n "$(ls dist/*-${expected_tag}.whl 2>/dev/null)" || {
              echo "::error::Expected an *${expected_tag}.whl in dist/; got:"
              ls dist/ || true
              exit 1
          }

      - name: Upload Android wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}-py3.13
          path: dist/
          retention-days: 7

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist
        run: maturin sdist --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  publish-to-pypi:
    name: Publish to PyPI
    # Every artifact (desktop wheels, Android wheels, sdist) goes to both
    # PyPI and the GitHub release.
    needs: [build-wheels, build-wheels-android, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/kohakunode
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*'
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload all wheels + sdist to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          fail_on_unmatched_files: false

      - name: Publish to PyPI (all wheels + sdist)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
